# The pipeline qits-ci runs on every push to a tracked branch of this repository.
#
# One ordinary sandboxed step, and no image: this repository does not ship a container. The app is
# packaged and served by qits-gateway, which carries this repo as a git submodule at its Quinoa
# ui-dir and builds it into the gateway image — so this pipeline's job is to keep main green
# (install, lint, test, build), and the gateway's pipeline is where the bundle becomes deployable.
steps:
  - image: qits/build-images/node-base:latest
    timeout-seconds: 1800
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this an early failure would be
      # swallowed by the next command's exit code.
      set -eu

      # npm lockfiles pin full resolved URLs, and this one is generated on the deployment host, so
      # every entry names http://localhost:8081 — unreachable from a step container, where the same
      # service is http://qits-artifacts:8080. The paths are identical on both addresses, so a pure
      # host swap makes the lockfile resolvable here. npm's own knob for this
      # (--replace-registry-host=always) cannot do it: it substitutes the configured registry's URL
      # *including its path* while keeping the resolved path too, and against this platform's
      # path-mounted registries that yields /artifacts/npm/npmjs/artifacts/npm/npm/… and a 404.
      sed -i 's|http://localhost:8081/|http://qits-artifacts:8080/|g' package-lock.json

      npm ci --no-audit --no-fund

      npm run lint

      # The jsdom target. This image has no browser and CI is not the place to download one.
      npm test

      npm run build
