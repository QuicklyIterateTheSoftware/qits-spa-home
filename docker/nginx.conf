# The server block for the built SPA. It replaces nginx:alpine's /etc/nginx/conf.d/default.conf,
# which listens on 80 — every qits component listens on 8080 inside its container, and qits-cd
# publishes that port, so an image that kept the nginx default would simply be unreachable.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The SPA fallback. Any path that is not a real file is the application's to route, so it gets
    # index.html and a 200 — a client-side route must not 404 on a page refresh. `=404` on the last
    # fallback is deliberate: a missing *asset* stays a missing asset instead of being served an
    # HTML document that the browser would then fail to parse as JavaScript.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Only the bundles, and only because `outputHashing: all` makes their NAMES change whenever
    # their bytes do — that is what makes "immutable" true rather than optimistic. Assets copied
    # verbatim out of public/ (favicon.ico among them) keep their name across a rebuild and are
    # deliberately not in this list.
    location ~* -[A-Z0-9]{8}\.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy stays invisible until a browser gives up on a
    # stale copy — and every hashed bundle above is reachable only through the document that names
    # it. api/config.json is the deployment's telemetry relay, read once per load; caching it would
    # freeze telemetry configuration into visitors' browsers.

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /api/config.json {
        add_header Cache-Control "no-cache";
    }
}
